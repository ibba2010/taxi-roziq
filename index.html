<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ТАКСИ РОЗИК</title>

<style>
body{
margin:0;
font-family:Arial;
background:#b30000;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
transition:0.3s;
color:white;
}

body.run{ background:#0a8f2a; }
body.pause{ background:#b30000; }

.card{
text-align:center;
background:rgba(0,0,0,0.25);
padding:25px;
border-radius:20px;
width:320px;
box-shadow:0 0 20px rgba(0,0,0,0.4);
}

h1{
margin:0 0 10px;
font-size:28px;
}

.money{
font-size:60px;
margin:20px 0;
font-weight:bold;
}

.info{
font-size:18px;
margin-bottom:15px;
opacity:0.9;
}

button{
padding:12px 18px;
font-size:18px;
border:none;
border-radius:10px;
margin:5px;
cursor:pointer;
font-weight:bold;
}

#start{ background:white; color:black; }
#reset{ background:orange; }
#finish{ background:red; color:white; }
</style>
</head>

<body class="pause">

<div class="card">
<h1>🚖 ТАКСИ РОЗИК</h1>

<div class="money" id="money">10</div>

<div class="info">
⏱ Каждые 1:30 = +1 сомони
</div>

<button id="start">Старт</button>
<button id="reset">Сброс</button>
<button id="finish">Завершить</button>
</div>

<script>
let money = 10;
let running = false;
let interval = null;

const moneyEl = document.getElementById("money");
const startBtn = document.getElementById("start");

function speak(text){
let msg = new SpeechSynthesisUtterance(text);
msg.lang = "ru-RU";
speechSynthesis.speak(msg);
}

function update(){
moneyEl.innerText = money;
}

startBtn.onclick = function(){

if(!running){
running = true;
document.body.className = "run";
startBtn.innerText = "Пауза";
speak("Поездка началась");

interval = setInterval(()=>{
money += 1;
update();
}, 90000); // 1 минута 30 секунд

}else{
running = false;
document.body.className = "pause";
startBtn.innerText = "Старт";
speak("Поездка поставлена на паузу");
clearInterval(interval);
}
};

document.getElementById("reset").onclick = function(){
money = 10;
update();
};

document.getElementById("finish").onclick = function(){
running = false;
clearInterval(interval);
document.body.className = "pause";
startBtn.innerText = "Старт";
speak("Поездка завершена");
money = 10;
update();
};
</script>

</body>
</html>
